name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - uses: actions/setup-node@v3
        with:
          node-version: 24.6.0

      - name: Install dependencies
        shell: bash
        run: |
          set -x
          set -e

          npm ci --ignore-scripts

      - name: Typecheck
        shell: bash
        run: npm run typecheck

      - name: Lint
        shell: bash
        run: npm run lint

      - name: Build
        shell: bash
        run: |
          set -x
          set -e

          npm run build

      - name: Validate CLAP
        shell: bash
        run: npm run validate:clap

      - name: Artifact naming
        shell: bash
        run: |
          echo "ARTIFACT_DATESTRING=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "ARTIFACT_OS=$(echo $RUNNER_OS | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: srvb-${{ env.ARTIFACT_OS }}-${{ env.ARTIFACT_DATESTRING }}
          path: |
            native/build/scripted/SRVB_artefacts/Release/SRVB.clap
            native/build/scripted/SRVB_artefacts/Release/SRVB.clap/**
            native/build/scripted/SRVB_artefacts/Release/SRVB.vst3
            native/build/scripted/SRVB_artefacts/Release/SRVB.vst3/**
            native/build/scripted/SRVB_artefacts/Release/SRVB.component
            native/build/scripted/SRVB_artefacts/Release/SRVB.component/**
